<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Einstein FLM QGR Prep — Manager Hub</title>
<!-- v1.8.1 2026-07-30 -->
<style>
:root{
  --orange-50:#FEF6EC; --orange-100:#FDE3C2; --orange-200:#FABD84; --orange-500:#EF8B22; --orange-700:#D96B10; --orange-900:#CC5500;
  --navy-50:#EEF1F4; --navy-100:#CDD5DA; --navy-200:#9AADB7; --navy-400:#507080; --navy-500:#27343D; --navy-700:#1A2329; --navy-900:#0B1014;
  --blue-50:#EBF4FB; --blue-100:#C3DFEF; --blue-500:#0979C3; --blue-700:#065E9A; --blue-900:#023B63;
  --grey-50:#F4F5F5; --grey-100:#E2E3E4; --grey-200:#C0C2C4; --grey-400:#787C7F; --grey-500:#53575A; --grey-700:#363839; --grey-900:#191A1B;
  --success:#69995D; --error:#CC0100;
  --text-faint:#5F6468;
  --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(39,52,61,.08); --shadow-md:0 4px 12px rgba(39,52,61,.10); --shadow-lg:0 12px 32px rgba(39,52,61,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--grey-700);background:var(--grey-50);font-size:14px;line-height:1.5;min-width:980px}
h1,h2,h3,h4{color:var(--navy-500);font-weight:700}
a{color:var(--blue-500)}
button{font:inherit;cursor:pointer}
::selection{background:var(--blue-100)}

#appHeader{background:var(--navy-500);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-md)}
#appHeader .brand{display:flex;align-items:baseline;gap:10px}
#appHeader .brand .bebas{font-family:'Bebas Neue','Roboto',sans-serif;font-size:26px;letter-spacing:.03em;color:#fff}
#appHeader .brand .tag{font-size:12px;color:var(--navy-100)}
#appHeader .savebox{font-size:11px;color:var(--navy-100);text-align:right}
#appHeader .savebox b{color:#fff}
main{max-width:1240px;margin:0 auto;padding:28px 28px 90px}
.view{display:none}
.view.active{display:block}
.muted{color:var(--text-faint)}
.small{font-size:12px}
.tiny{font-size:11px}
.badge{display:inline-block;padding:2px 9px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.badge.crit{background:var(--orange-100);color:var(--orange-900)}
.badge.pos{background:var(--navy-50);color:var(--navy-500)}
.badge.vacant{background:var(--grey-100);color:var(--grey-500)}

/* ---- Landing / find your page ---- */
.landing-intro{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:24px;margin-bottom:24px}
.landing-intro h2{font-size:20px;margin-bottom:6px}
.landing-intro p{font-size:13px;color:var(--grey-500);max-width:760px}
.region-head{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey-400);margin:26px 0 12px;font-weight:700}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.b-card{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:18px 20px;box-shadow:var(--shadow-sm)}
.b-card h3{font-size:15px;margin-bottom:10px}
.b-card .person-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--grey-50);gap:8px}
.b-card .person-line:first-of-type{border-top:none}
.b-card .pname{font-size:13px;font-weight:700;color:var(--navy-500)}
.b-card .pname .role{font-weight:400;color:var(--grey-400);font-size:11.5px;margin-left:6px}
.b-card .open-btn{background:var(--navy-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:6px 14px;font-size:11.5px;font-weight:700}
.b-card .open-btn:hover{background:var(--navy-700)}
.b-card .started{font-size:10px;color:var(--success);font-weight:700}

/* ---- Leadership-went-first band ---- */
.first-band{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-md);padding:14px 20px;font-size:12.5px;color:var(--blue-900);margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.first-band .fb-ico{font-size:16px;line-height:1.3}

/* ---- Person hub ---- */
.hub-head{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:18px 24px;margin-bottom:20px;gap:16px}
.hub-head h2{font-size:21px;margin:0}
.hub-head .sub{font-size:12px;color:var(--grey-400);margin-top:2px}
.hub-head .progress-wrap{display:flex;align-items:center;gap:10px}
.progress-track{width:180px;height:8px;background:var(--grey-100);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--orange-500);transition:width .3s}
.backlink{background:none;border:none;color:var(--blue-500);font-size:12.5px;font-weight:700;padding:0;margin-bottom:14px;display:inline-block}
.hub-grid{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.hub-rail .pane{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:14px}
.hub-rail .pane h4{font-size:13px;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.hub-rail .pane p{font-size:11.5px;color:var(--grey-400);line-height:1.5}
.hub-rail .pane.placeholder{border-style:dashed;background:var(--grey-50)}
.hub-rail .pane .soon{font-size:9.5px;font-weight:700;background:var(--grey-100);color:var(--grey-500);border-radius:var(--radius-pill);padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
.hub-rail .pane.live{border-color:var(--orange-200)}
.hub-rail .pane .now{font-size:9.5px;font-weight:700;background:var(--orange-100);color:var(--orange-900);border-radius:var(--radius-pill);padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
/* track record mock */
.tr-mock{margin-top:10px;border-top:1px dashed var(--grey-200);padding-top:10px}
.tr-mock .mockbars{display:flex;align-items:flex-end;gap:5px;height:52px;margin:8px 0 4px}
.tr-mock .mb{flex:1;border-radius:3px 3px 0 0;background:var(--navy-200);position:relative}
.tr-mock .mb.you{background:var(--orange-500)}
.tr-mock .mb span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:8.5px;color:var(--grey-400);font-weight:700}
.tr-mock .legend{font-size:9.5px;color:var(--grey-400)}
.tr-mock .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.mock-tag{font-size:9px;font-weight:700;color:var(--grey-400);border:1px dashed var(--grey-200);border-radius:var(--radius-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}

/* ---- Sections ---- */
.section{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:24px;margin-bottom:16px}
.section > .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.section h3{font-size:15px;display:flex;align-items:center;gap:8px}
.section .shelp{font-size:12px;color:var(--grey-400);margin-bottom:14px;line-height:1.5}
.section .done-chip{font-size:10.5px;color:var(--success);font-weight:700}

/* goal cards */
.goal-card{border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:14px}
.goal-card.is-crit{border-color:var(--orange-200)}
.goal-card .ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.goal-card .gtitle{font-size:14px;font-weight:700;color:var(--navy-500)}
details.defs{font-size:11.5px;color:var(--grey-500);margin:6px 0 10px}
details.defs summary{cursor:pointer;font-weight:700;color:var(--grey-400);user-select:none;list-style:none}
details.defs summary::-webkit-details-marker{display:none}
details.defs summary:before{content:"▸ "}
details.defs[open] summary:before{content:"▾ "}
.def-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;padding:10px 12px;background:var(--grey-50);border-radius:8px}
.def-grid b.sg{color:var(--success)}
.def-grid b.g{color:#3E6636}
.def-grid b.r{color:var(--error)}
.chiprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1.5px solid var(--grey-200);background:#fff;border-radius:var(--radius-sm);padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--grey-500);min-width:38px;text-align:center}
.chip:hover{border-color:var(--navy-400)}
.chip.sel{background:var(--navy-500);border-color:var(--navy-500);color:#fff}
.chip.sel.good{background:var(--success);border-color:var(--success)}
.chip.sel.mid{background:var(--orange-700);border-color:var(--orange-700)}
.chip.sel.bad{background:var(--error);border-color:var(--error)}
.proj-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--grey-500);margin-left:10px}
.q-block{margin-top:12px}
.q-block label{display:block;font-size:12px;font-weight:700;color:var(--navy-500);margin-bottom:3px}
.q-block label .qhint{font-weight:400;color:var(--grey-400)}
.q-block textarea{width:100%;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:12.5px;resize:vertical;min-height:40px}
.q-block textarea.depth{min-height:64px}
.q-block textarea.note-missing{border-color:var(--orange-500);background:var(--orange-50)}
.depth-hint{font-size:11px;color:var(--orange-900);background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-sm);padding:5px 10px;margin-top:10px;display:inline-block}
.bullets-mini{font-size:11.5px;color:var(--navy-500);background:var(--orange-50);border:1px solid var(--orange-100);border-radius:var(--radius-sm);padding:8px 12px;margin:12px 0 12px;line-height:1.55}
.bullets-mini details{margin-top:4px;color:var(--grey-500)}
.bullets-mini summary{cursor:pointer;font-weight:700;color:var(--orange-900);font-size:11px}
.interview-callout{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:16px;font-size:12.5px;color:var(--blue-900);line-height:1.55}
.ic-actions{display:flex;gap:8px;margin-top:10px}
.ic-btn{background:var(--blue-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-size:12px;font-weight:700}
.ic-btn:hover{background:var(--blue-700)}
.ic-btn.secondary{background:#fff;color:var(--blue-700);border:1px solid var(--blue-100)}
#pasteWrap{margin-top:10px}
#pasteBox{width:100%;min-height:110px;border:1px solid var(--blue-100);border-radius:var(--radius-sm);padding:10px;font:inherit;font-size:12px;margin-bottom:8px;resize:vertical}
.take-chip{font-size:12px;color:var(--navy-500);background:var(--navy-50);border:1px solid var(--navy-100);border-radius:var(--radius-sm);padding:8px 12px;margin-top:10px;line-height:1.5}
.take-use{background:#fff;border:1px solid var(--navy-200);border-radius:var(--radius-sm);padding:4px 10px;font-size:11px;font-weight:700;color:var(--navy-500);margin-left:6px}
.take-use:hover{border-color:var(--navy-400)}
.roadmap-card{background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:20px 24px;margin-top:26px}
.roadmap-card h3{font-size:15px;margin-bottom:4px}
.roadmap-card .rm-sub{font-size:12px;color:var(--grey-400);margin-bottom:12px}
.roadmap-card ul{list-style:none}
.roadmap-card li{padding:7px 0;border-top:1px solid var(--grey-50);font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.roadmap-card li:first-child{border-top:none}
.rm-chip{flex-shrink:0;font-size:9.5px;font-weight:700;border-radius:var(--radius-pill);padding:2px 9px;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.rm-chip.now{background:#E3EEDF;color:#3E6636}
.rm-chip.next{background:var(--orange-100);color:var(--orange-900)}
.rm-chip.later{background:var(--grey-100);color:var(--grey-500)}

/* collapsed goal cards + section nav + chip sublabels + storage warning */
.goal-card .ghead{cursor:pointer;user-select:none}
.goal-card .ghead:hover .gtitle{color:var(--blue-700)}
.gsum-color{font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 10px;white-space:nowrap}
.gsum-color.cSG,.gsum-color.cG{background:#E3EEDF;color:#3E6636}
.gsum-color.cR{background:#F8DCDC;color:#8E0000}
.gsum-color.cnone{background:var(--grey-100);color:var(--grey-500)}
.goal-card .caret{font-size:11px;color:var(--grey-400);margin-left:6px}
.goal-card.collapsed .gbody{display:none}
#secNav{display:flex;gap:2px;background:#fff;border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:5px 8px;margin-bottom:16px;position:sticky;top:63px;z-index:45;box-shadow:var(--shadow-sm);flex-wrap:wrap}
#secNav button{background:none;border:none;padding:7px 10px;font-size:12px;font-weight:700;color:var(--grey-500);border-radius:var(--radius-sm)}
#secNav button:hover{background:var(--grey-50);color:var(--navy-500)}
#secNav button .ok{color:var(--success)}
.chip .csub{display:block;font-size:8.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--grey-400);margin-top:1px;line-height:1.1}
.chip.sel .csub{color:rgba(255,255,255,.85)}
#storageWarn{display:none;background:#F8DCDC;color:#8E0000;border:1px solid #E6B2B2;border-radius:var(--radius-md);padding:12px 16px;font-size:12.5px;font-weight:700;margin-bottom:16px}
#storageWarn.show{display:block}

/* CHOICES rows */
.row{border-top:1px solid var(--grey-50);padding:14px 0}
.row:first-child{border-top:none;padding-top:0}
.row .rowhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.row .rtitle{font-size:13px;font-weight:700;color:var(--navy-500)}
.rownote{width:100%;margin-top:8px;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:7px 10px;font:inherit;font-size:12.5px;resize:vertical;min-height:38px}
.rownote.note-missing{border-color:var(--orange-500);background:var(--orange-50)}

/* 2b · Evaluate your managers (7/29) — per-direct sub-cards inside the section, GWC toggles + Nine-More Test */
.togglepair{display:flex;gap:6px}
.togglepair button{border:1.5px solid var(--grey-200);background:#fff;border-radius:var(--radius-sm);padding:6px 14px;font-size:12px;font-weight:700;color:var(--grey-500)}
.togglepair button.yes.sel{background:var(--success);border-color:var(--success);color:#fff}
.togglepair button.no.sel{background:var(--error);border-color:var(--error);color:#fff}
.de-block{border:1px solid var(--grey-100);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:18px;background:var(--grey-50)}
.de-block:last-child{margin-bottom:0}
.de-name{font-size:14px;margin-bottom:10px}
.de-role{font-size:11px;font-weight:400;color:var(--grey-400);margin-left:6px}
.de-sub{margin-bottom:14px}
.de-sub:last-child{margin-bottom:0}
.de-subhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--grey-400);margin-bottom:6px}

/* v1.4: parked packet section, leadership-only KPI rows, thin-answer nudge */
.sec-parked{opacity:.55}
.sec-parked input{pointer-events:none}
.pane-parked{opacity:.6}
tr.kpi-locked{opacity:.5}
tr.kpi-locked input{background:var(--grey-50)}
textarea.thin{border-color:var(--orange-500)!important;background:var(--orange-50)}

/* KPI table */
table.kpi-table{width:100%;border-collapse:collapse;font-size:12.5px}
table.kpi-table th{background:var(--navy-50);color:var(--navy-500);padding:8px 10px;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em}
table.kpi-table td{padding:8px 10px;border-bottom:1px solid var(--grey-50);vertical-align:top}
table.kpi-table input[type=text]{border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:6px 9px;font:inherit;font-size:12.5px;width:130px}
.blank-note{font-size:11px;color:var(--text-faint);font-style:italic}

textarea.narrative{width:100%;min-height:90px;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:12px;font:inherit;font-size:13px;resize:vertical}
.check-line{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px}
.check-line input{width:16px;height:16px}

/* export */
.export-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.export-actions button{background:var(--navy-500);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px 20px;font-size:12.5px;font-weight:700}
.export-actions button:hover{background:var(--navy-700)}
.export-actions button.secondary{background:#fff;color:var(--navy-500);border:1px solid var(--grey-200)}
.export-actions button.secondary:hover{border-color:var(--navy-400)}
textarea.mdpreview{width:100%;min-height:140px;margin-top:12px;border:1px solid var(--grey-200);border-radius:var(--radius-sm);padding:10px;font-family:monospace;font-size:11px;resize:vertical;display:none}
textarea.mdpreview.show{display:block}

footer{background:var(--navy-700);color:var(--navy-100);text-align:center;padding:14px;font-size:11px;position:fixed;bottom:0;left:0;right:0;z-index:40}
.toast{position:fixed;bottom:52px;right:24px;background:var(--navy-500);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:12.5px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(6px);transition:.25s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.nodata{background:var(--orange-50);border:1px solid var(--orange-200);border-radius:var(--radius-md);padding:24px;font-size:13px;color:var(--orange-900)}
</style>
</head>
<body>
<header id="appHeader">
  <div class="brand"><span class="bebas">EINSTEIN FLM QGR PREP</span><span class="tag">Frontline Manager AAR &amp; Self-Eval · Q2 2026 · v1.6.4</span></div>
  <div class="savebox" id="saveBox">Local only — nothing leaves this computer<br><b id="saveStamp">—</b></div>
</header>
<main>
  <div id="storageWarn"></div>
  <section class="view active" id="view-landing"></section>
  <section class="view" id="view-person"></section>
</main>
<footer>Internal tool · evaluations stay on this computer until YOU export and share them · Einstein Moving Company</footer>
<div class="toast" id="toast"></div>

<script src="preload-data.js"></script>
<script src="aar-takes.js"></script><!-- optional: "our take" pre-population from the QGR manifest; 404 is harmless -->
<script>
/* ============ Constants ============ */
const LS_KEY = "einstein-aar-mgr-v1";
const QUARTER = "Q2 2026";
const CORE_VALUES = [
  "Communicate clearly and with kindness",
  "Hustle but don't rush",
  "Ownership over results",
  "Improve with Enthusiasm",
  "Conscientious attention to detail",
  "Elevate attitudes",
  "Support Generously"
];
const CV_ANCHORS = {1:"active problem",2:"below the bar",3:"meets the bar",4:"strong, with named opportunities",5:"best of the best — the shining example you'd point the whole team to"};
const CV_SUBS = {1:"problem",2:"below bar",3:"meets bar",4:"strong",5:"best of the best"};
const CV_OPTIONS = [1,2,3,4,5].map(n=>({v:String(n),label:String(n),sub:CV_SUBS[n],cls:n>=4?"good":n===3?"mid":"bad",title:CV_ANCHORS[n]}));
// 2b · Evaluate your managers (7/29, Cameron's QGR Day-1 ruling) — Ideal Team Player rubric, same
// 1-5 chip component as CHOICES (chipRowHtml/CV-style rendering), different anchor text.
const ITP_TRAITS = [
  {key:"humble", label:"Humble", def:"Lacks excessive ego, shares credit."},
  {key:"hungry", label:"Hungry", def:"Self-motivated, always looking for more."},
  {key:"smart",  label:"Smart",  def:"People-smart, interpersonally aware."}
];
/* Cameron 7/29: ITP uses the SAME 1–5 scale language as CHOICES — one scale everywhere. */
const ITP_OPTIONS = CV_OPTIONS;
const SGR_OPTIONS = [
  {v:"SG",label:"Super Green",cls:"good",title:"Exceeded the written Super Green definition"},
  {v:"G",label:"Green",cls:"good",title:"Hit the written Green definition"},
  {v:"R",label:"Red",cls:"bad",title:"Missed Green"}
];
const AAR_QUESTIONS = [
  {k:"results", label:"1 · Results", hint:"final numbers + why this color — graded against the written Green definition, not the vibe. Still running? project to quarter-end and check PROJ."},
  {k:"how",     label:"2 · How we got here", hint:"the honest story behind the color, brutal parts included."},
  {k:"well",    label:"3 · What went well", hint:"what should we keep doing or turn into a playbook?"},
  {k:"diff",    label:"4 · What did you try — and what would you do differently", hint:"the bullets you fired (see the note above): what you did beyond the seat's standard routine to move this number, what it taught you, and what you'd change next quarter."}
];

/* ============ State ============ */
let STATE = { records:{}, lastSaved:null };
let currentPersonId = null;
let saveTimer = null;
let EXPANDED = new Set(); // which goal cards are open (session-only, not saved)

function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) STATE = Object.assign(STATE, JSON.parse(raw)); }catch(e){ console.warn("state load failed", e); }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    STATE.lastSaved = new Date().toISOString();
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(STATE));
      renderSaveStamp();
    }catch(e){
      const w = document.getElementById("storageWarn");
      w.textContent = "⚠ NOT SAVING — this browser is blocking local storage. Don't close this tab. Go to section 6 and Copy your write-up somewhere safe now.";
      w.classList.add("show");
      document.getElementById("saveStamp").textContent = "NOT SAVING";
    }
  }, 250);
}
function renderSaveStamp(){
  const el = document.getElementById("saveStamp");
  el.textContent = STATE.lastSaved ? "Saved " + new Date(STATE.lastSaved).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "—";
}
function emptyRecord(person){
  return {
    quarter: QUARTER,
    goals: {},        // num -> {color, proj, results, how, well, diff}
    choices: { items: Object.fromEntries(CORE_VALUES.map(cv=>[cv,"3"])), itemNotes:{} },  /* Cameron 7/29: 3 = the default; 4/5 must be an intentional click */
    kpis: {},         // kpi name -> {est, actual, note}
    constraint: "",
    opportunity: "",
    packet: { reviewed:false, questions:"" },
    interviewDone: false,
    flywheel: { reviewed:false, bring:"" },
    startedAt: null,
    person: { id: person.id, name: person.name, position: person.position, branch: person.branch, region: person.region }
  };
}
// 2b · Evaluate your managers — the OTHER non-vacant seats on a BM's own branch (ops/field/flex),
// derived live from PRELOAD every render. No hardcoded rosters — a branch's roster changes the
// moment preload-data.js changes.
function directsFor(person){
  if(!havePreload()) return [];
  return PRELOAD.people.filter(p=>p.branch===person.branch && p.position!=="BM" && p.name);
}
function emptyDirectEval(){
  return {
    coreValues: { items: Object.fromEntries(CORE_VALUES.map(cv=>[cv,"3"])), itemNotes:{} },
    itp: { humble:{v:"3",note:""}, hungry:{v:"3",note:""}, smart:{v:"3",note:""} },
    gwc: { get:null, want:null, capacity:null, notes:{get:"",want:"",capacity:""} },
    /* 7/30 ruling: rehire question RETIRED (28/30 went blind-Yes). Replaced by nineMore, always the
       LAST question. rehire key kept only so pre-7/30 saved records don't crash — never written to
       again, never rendered. */
    rehire: null,
    nineMore: { performance:"same", culture:"same", note:"" },
    overallNote: ""
  };
}
function directsEvalDone(person, rec){
  if(person.position !== "BM") return true;
  const directs = directsFor(person);
  return directs.every(d=>{
    const de = (rec.directsEval||{})[d.name];
    if(!de) return false;
    const cvOk = CORE_VALUES.every(cv=> de.coreValues.items[cv] && (de.coreValues.itemNotes[cv]||"").trim());
    const itpOk = ITP_TRAITS.every(t=> de.itp[t.key] && de.itp[t.key].v && (de.itp[t.key].note||"").trim());
    const gwcOk = ["get","want","capacity"].every(k=> de.gwc[k]!=null && ((de.gwc.notes||{})[k]||"").trim());
    const nineMoreOk = !!((de.nineMore||{}).note||"").trim();
    return cvOk && itpOk && gwcOk && nineMoreOk;
  });
}
function getRecord(person){
  if(!STATE.records[person.id]) STATE.records[person.id] = emptyRecord(person);
  const rec = STATE.records[person.id];
  // backfill fields added later so old saves never crash
  if(!rec.choices) rec.choices = {items:{},itemNotes:{}};
  if(!rec.choices.itemNotes) rec.choices.itemNotes = {};
  /* Cameron 7/29 default-3: fill-only backfill — a value never scored (and with no note) starts
     at 3 even on records created before this rule. Real scores are never touched. */
  CORE_VALUES.forEach(cv=>{ if(rec.choices.items[cv]==null && !(rec.choices.itemNotes[cv]||"").trim()) rec.choices.items[cv]="3"; });
  if(!rec.kpis) rec.kpis = {};
  if(!rec.packet) rec.packet = {reviewed:false,questions:""};
  if(typeof rec.interviewDone === "undefined") rec.interviewDone = false;
  if(!rec.flywheel) rec.flywheel = {reviewed:false, bring:""};
  // 2b backfill (7/29) — BM only. Same fill-only contract: a direct's blank 1-5 fields default to
  // "3", never overwriting a real score or an existing note. Runs every getRecord() call so a
  // roster change in preload-data.js (a new manager added) picks up a fresh directsEval slot too.
  if(!rec.directsEval) rec.directsEval = {};
  if(person.position === "BM"){
    directsFor(person).forEach(d=>{
      if(!rec.directsEval[d.name]) rec.directsEval[d.name] = emptyDirectEval();
      const de = rec.directsEval[d.name];
      if(!de.coreValues) de.coreValues = {items:{},itemNotes:{}};
      if(!de.coreValues.itemNotes) de.coreValues.itemNotes = {};
      CORE_VALUES.forEach(cv=>{ if(de.coreValues.items[cv]==null && !(de.coreValues.itemNotes[cv]||"").trim()) de.coreValues.items[cv]="3"; });
      if(!de.itp) de.itp = {};
      ITP_TRAITS.forEach(t=>{
        if(!de.itp[t.key]) de.itp[t.key] = {v:null,note:""};
        if(de.itp[t.key].v==null && !(de.itp[t.key].note||"").trim()) de.itp[t.key].v="3";
      });
      if(!de.gwc) de.gwc = {get:null,want:null,capacity:null,notes:{}};
      if(!de.gwc.notes) de.gwc.notes = {get:"",want:"",capacity:""};
      if(typeof de.rehire === "undefined") de.rehire = null; // legacy field, read-only going forward
      if(!de.nineMore) de.nineMore = {performance:"same", culture:"same", note:""};
      if(de.nineMore.performance==null) de.nineMore.performance = "same";
      if(de.nineMore.culture==null) de.nineMore.culture = "same";
      if(typeof de.overallNote !== "string") de.overallNote = "";
    });
  }
  return rec;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============ Progress ============ */
function recProgress(person, rec){
  // honest progress: criticals owe questions 2+4, a rating owes its note
  let done = 0, total = 0;
  (person.goals||[]).forEach(g=>{
    total += 2; // a color + at least the results answer
    const gr = rec.goals[g.num]||{};
    if(gr.color) done++;
    if((gr.results||"").trim()) done++;
    if(g.critical){
      total += 2;
      if((gr.how||"").trim()) done++;
      if((gr.diff||"").trim()) done++;
    }
  });
  CORE_VALUES.forEach(cv=>{ total++; if(rec.choices.items[cv] && (rec.choices.itemNotes[cv]||"").trim()) done++; });
  if(person.position === "BM"){
    directsFor(person).forEach(d=>{
      const de = (rec.directsEval||{})[d.name] || emptyDirectEval();
      CORE_VALUES.forEach(cv=>{ total++; if(de.coreValues.items[cv] && (de.coreValues.itemNotes[cv]||"").trim()) done++; });
      ITP_TRAITS.forEach(t=>{ total++; const rt=de.itp[t.key]||{}; if(rt.v && (rt.note||"").trim()) done++; });
      ["get","want","capacity"].forEach(k=>{ total++; if(de.gwc[k]!=null && ((de.gwc.notes||{})[k]||"").trim()) done++; });
      total++; if(((de.nineMore||{}).note||"").trim()) done++;
    });
  }
  total++; if((rec.constraint||"").trim() || (rec.opportunity||"").trim()) done++;
  return total ? Math.round(done/total*100) : 0;
}

/* ============ Person hub ============ */
function openPerson(id){
  currentPersonId = id;
  const person = personById(id);
  const rec = getRecord(person);
  if(!rec.startedAt){ rec.startedAt = new Date().toISOString(); queueSave(); }
  // one goal open at a time: default to the first goal without a color yet
  const firstOpen = (person.goals||[]).find(g=>!(rec.goals[g.num]||{}).color);
  EXPANDED = new Set(firstOpen ? [String(firstOpen.num)] : []);
  document.getElementById("view-landing").classList.remove("active");
  document.getElementById("view-person").classList.add("active");
  renderPerson();
  window.scrollTo(0,0);
}
function backToLanding(){
  currentPersonId = null;
  document.getElementById("view-person").classList.remove("active");
  document.getElementById("view-landing").classList.add("active");
  renderLanding();
  window.scrollTo(0,0);
}

  const person = personById(currentPersonId);

  return goals.length>0 && goals.every(g=>(rec.goals[g.num]||{}).color);

/* Nine-More Test (7/30 ruling — replaces the retired "enthusiastically rehire?" question, which had
   gone blind at 28/30 Yes). Sits directly under GWC, above the overall note (Cameron's 7/30
   placement correction). dimPrefix keys the two chip
   rows through the same click-delegation pattern as everything else ("<prefix>:perf"/":culture"). */
function nineMoreBlockHtml(dimPrefix, de){
  const nm = de.nineMore || {performance:"same", culture:"same", note:""};
  const avg = deAverages(de);
  const recapBits = [];
  if(avg.choices!=null) recapBits.push("CHOICES avg "+avg.choices.toFixed(1));
  if(avg.itp!=null) recapBits.push("ITP avg "+avg.itp.toFixed(1));
  const recap = recapBits.length
    ? 'You scored them: '+recapBits.join(' · ')+(avg.composite!=null?' → composite '+avg.composite.toFixed(1):'')+'. Now the net call.'
    : "Score CHOICES and ITP above, then make the net call.";
  const arrowRow = (dim, val)=>[
    ["better","⬆ Better"],["same","↔ Same"],["worse","⬇ Worse"]
  ].map(([v,label])=>
    '<button type="button" class="chip'+(val===v?' sel '+(v==="worse"?"bad":v==="better"?"good":"mid"):'')+'" data-dim="'+esc(dim)+'" data-val="'+v+'">'+label+'</button>'
  ).join("");
  const noteMissing = !nm.note || !nm.note.trim();
  return '<div class="de-sub nine-more"><div class="de-subhead">🧪 The Nine-More Test</div>'+
    '<div class="tiny muted" style="margin-bottom:6px">'+esc(recap)+'</div>'+
    '<div class="tiny" style="margin-bottom:8px"><b>Imagine nine more of them on your team.</b></div>'+
    '<div class="row"><div class="rowhead"><div class="rtitle">Team performance:</div></div><div class="chiprow">'+arrowRow(dimPrefix+":perf", nm.performance)+'</div></div>'+
    '<div class="row"><div class="rowhead"><div class="rtitle">Team culture:</div></div><div class="chiprow">'+arrowRow(dimPrefix+":culture", nm.culture)+'</div></div>'+
    '<textarea class="rownote'+(noteMissing?' note-missing':'')+'" data-denineminenote="'+esc(dimPrefix)+'" placeholder="Why? Name the evidence — one note covering both.">'+esc(nm.note||"")+'</textarea>'+
    '<div class="tiny muted" style="margin-top:4px">"Same" is a real answer, not a dodge — most solid people are ↔/↔. The two arrows disagreeing is the signal worth writing about: strong numbers that cost you culture, or great culture that isn\'t pulling weight.</div>'+
    '</div>';
}
function deAverages(de){
  const cvVals = CORE_VALUES.map(cv=>Number(de.coreValues.items[cv])).filter(n=>!isNaN(n));
  const itpVals = ITP_TRAITS.map(t=>Number((de.itp[t.key]||{}).v)).filter(n=>!isNaN(n));
  const choices = cvVals.length ? cvVals.reduce((a,b)=>a+b,0)/cvVals.length : null;
  const itp = itpVals.length ? itpVals.reduce((a,b)=>a+b,0)/itpVals.length : null;
  const composite = (choices!=null && itp!=null) ? (choices+itp)/2 : (choices!=null ? choices : itp);
  return {choices, itp, composite};
}

/* ============ Wiring ============ */
function wirePerson(person, rec){
  const wrap = document.getElementById("view-person");
  document.getElementById("backBtn").addEventListener("click", backToLanding);

  wrap.querySelectorAll("[data-jump]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const el = document.getElementById(btn.dataset.jump);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  const copyInterview = ()=>{
    const prompt = buildInterviewPrompt(person, rec);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(prompt).then(()=>toast("Interview prompt copied — paste it into Claude and let it push back"), ()=>{
        const pv = document.getElementById("mdPreview"); if(pv){ pv.value = prompt; pv.classList.add("show"); } toast("Copy blocked — grab it from the preview in section 6");
      });
    } else {
      const pv = document.getElementById("mdPreview"); if(pv){ pv.value = prompt; pv.classList.add("show"); } toast("Copy not available — grab it from the preview in section 6");
    }
  };
  wrap.querySelectorAll("[data-copyinterview]").forEach(b=>b.addEventListener("click", copyInterview));
  const pw = document.getElementById("pasteWrap");
  wrap.querySelectorAll("[data-pasteback]").forEach(b=>b.addEventListener("click", ()=>{
    pw.style.display = pw.style.display==="none" ? "block" : "none";
    if(pw.style.display==="block") document.getElementById("pasteBox").focus();
  }));
  const applyBtn = document.getElementById("applyPaste");
  if(applyBtn) applyBtn.addEventListener("click", ()=>{
    const parsed = parseClaudeResults(document.getElementById("pasteBox").value, person);
    if(!parsed || !parsed.goals || !parsed.goals.length){ toast("Couldn't find the answers block — make sure you pasted Claude's WHOLE final message (it ends with a code block)."); return; }
    let filled = 0, skipped = 0;
    parsed.goals.forEach(g=>{
      const known = (person.goals||[]).find(pg=>String(pg.num)===String(g.num));
      if(!known){ skipped++; return; }
      const tgt = rec.goals[g.num] = rec.goals[g.num]||{};
      if(g.color && ["SG","G","R"].includes(g.color)) tgt.color = g.color;
      tgt.proj = !!g.proj;
      ["results","how","well","differently"].forEach(k=>{
        const dst = k==="differently" ? "diff" : k;
        if(typeof g[k]==="string" && g[k].trim()) tgt[dst] = g[k].trim();
      });
      filled++;
    });
    queueSave(); renderPerson();
    toast("Filled "+filled+" goal"+(filled===1?"":"s")+(skipped?" ("+skipped+" skipped — unknown goal number)":"")+" — read them over, they're yours now.");
  });
  /* usetake wiring removed v1.6.2 */

  /* goal-card open/close — restored v1.6.4 (was deleted as collateral with the
     usetake block in v1.6.2, which left every collapsed goal card unopenable) */
  wrap.querySelectorAll("[data-gtoggle]").forEach(h=>{
    h.addEventListener("click", (e)=>{
      if(e.target.closest("button,input,textarea,details")) return; // don't toggle on inner controls
      const n = h.dataset.gtoggle;
      if(EXPANDED.has(n)) EXPANDED.delete(n); else EXPANDED.add(n);
      renderPerson();
    });
  });

  wrap.querySelectorAll("[data-dim]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const dim = btn.dataset.dim, val = btn.dataset.val;
      if(dim.startsWith("goal:")){
        const num = dim.slice(5);
        if(!rec.goals[num]) rec.goals[num] = {};
        rec.goals[num].color = rec.goals[num].color===val ? null : val;
      } else if(dim.startsWith("cv:")){
        const cv = dim.slice(3);
        rec.choices.items[cv] = rec.choices.items[cv]===val ? undefined : val;
        if(rec.choices.items[cv]===undefined) delete rec.choices.items[cv];
      } else if(dim.startsWith("nm:")){
        // "nm:<directId>:perf" or "nm:<directId>:culture" — Nine-More Test arrows
        const rest = dim.slice(3);
        const c1 = rest.lastIndexOf(":");
        const directId = rest.slice(0, c1);
        const field = rest.slice(c1+1); // "perf" or "culture"
        const dp = personById(directId);
        if(dp){
          if(!rec.directsEval) rec.directsEval = {};
          if(!rec.directsEval[dp.name]) rec.directsEval[dp.name] = emptyDirectEval();
          const de = rec.directsEval[dp.name];
          if(!de.nineMore) de.nineMore = {performance:"same", culture:"same", note:""};
          if(field==="perf") de.nineMore.performance = val;
          else if(field==="culture") de.nineMore.culture = val;
        }
      } else if(dim.startsWith("de:")){
        // "de:<directId>:cv:<cvName>" or "de:<directId>:itp:<traitKey>"
        const rest = dim.slice(3);
        const c1 = rest.indexOf(":");
        const directId = rest.slice(0, c1);
        const rest2 = rest.slice(c1+1);
        const c2 = rest2.indexOf(":");
        const kind = rest2.slice(0, c2), key = rest2.slice(c2+1);
        const dp = personById(directId);
        if(dp){
          if(!rec.directsEval) rec.directsEval = {};
          if(!rec.directsEval[dp.name]) rec.directsEval[dp.name] = emptyDirectEval();
          const de = rec.directsEval[dp.name];
          if(kind==="cv"){
            de.coreValues.items[key] = de.coreValues.items[key]===val ? undefined : val;
            if(de.coreValues.items[key]===undefined) delete de.coreValues.items[key];
          } else if(kind==="itp"){
            if(!de.itp[key]) de.itp[key] = {v:null,note:""};
            de.itp[key].v = de.itp[key].v===val ? null : val;
          }
        }
      }
      queueSave(); renderPerson();
    });
  });
  wrap.querySelectorAll("[data-proj]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const num = cb.dataset.proj;
      if(!rec.goals[num]) rec.goals[num] = {};
      rec.goals[num].proj = cb.checked;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-goalq]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const [num,k] = ta.dataset.goalq.split(":");
      if(!rec.goals[num]) rec.goals[num] = {};
      const t = ta.value.trim();
      const nudge = (k==="results"||k==="how");
      ta.classList.toggle("thin", nudge && !!t && t.length < 100);
      ta.title = (nudge && !!t && t.length < 100) ? "Thin answer — one or two lines isn't an AAR. Say more, or let the Claude interview pull it out of you." : "";
      rec.goals[num][k] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-cvnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      rec.choices.itemNotes[ta.dataset.cvnote] = ta.value;
      queueSave();
    });
  });
  // 2b · Evaluate your managers — note fields + GWC toggles. Same split-key pattern as the
  // chip click handler above ("<directId>|<field>"); directId -> name resolved via personById so
  // rec.directsEval stays keyed by name (matches the export shape + the PA-directs tool).
  const deDirectByField = (raw)=>{
    const bar = raw.indexOf("|");
    const id = bar===-1 ? raw : raw.slice(0,bar);
    const key = bar===-1 ? null : raw.slice(bar+1);
    const dp = personById(id);
    if(!dp) return null;
    if(!rec.directsEval) rec.directsEval = {};
    if(!rec.directsEval[dp.name]) rec.directsEval[dp.name] = emptyDirectEval();
    return {de: rec.directsEval[dp.name], key};
  };
  wrap.querySelectorAll("[data-decvnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const hit = deDirectByField(ta.dataset.decvnote);
      if(!hit) return;
      hit.de.coreValues.itemNotes[hit.key] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-deitpnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const hit = deDirectByField(ta.dataset.deitpnote);
      if(!hit) return;
      if(!hit.de.itp[hit.key]) hit.de.itp[hit.key] = {v:null,note:""};
      hit.de.itp[hit.key].note = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-degwcnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const hit = deDirectByField(ta.dataset.degwcnote);
      if(!hit) return;
      hit.de.gwc.notes[hit.key] = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-deoverallnote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const hit = deDirectByField(ta.dataset.deoverallnote);
      if(!hit) return;
      hit.de.overallNote = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-degwc]").forEach(group=>{
    group.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const hit = deDirectByField(group.dataset.degwc);
        if(!hit) return;
        hit.de.gwc[hit.key] = btn.dataset.v === "true";
        queueSave(); renderPerson();
      });
    });
  });
  wrap.querySelectorAll("[data-denineminenote]").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      // data-denineminenote carries "nm:<directId>" (from nineMoreBlockHtml's dimPrefix) — strip it.
      const rawId = ta.dataset.denineminenote.startsWith("nm:") ? ta.dataset.denineminenote.slice(3) : ta.dataset.denineminenote;
      const dp = personById(rawId);
      if(!dp) return;
      if(!rec.directsEval) rec.directsEval = {};
      if(!rec.directsEval[dp.name]) rec.directsEval[dp.name] = emptyDirectEval();
      const de = rec.directsEval[dp.name];
      if(!de.nineMore) de.nineMore = {performance:"same", culture:"same", note:""};
      de.nineMore.note = ta.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-kpi]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const idx = inp.dataset.kpi.lastIndexOf(":");
      const name = inp.dataset.kpi.slice(0,idx), k = inp.dataset.kpi.slice(idx+1);
      if(!rec.kpis[name]) rec.kpis[name] = {};
      rec.kpis[name][k] = inp.value;
      queueSave();
    });
  });
  wrap.querySelectorAll("[data-field]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const f = el.dataset.field;
      if(f==="constraint") rec.constraint = el.value;
      else if(f==="opportunity") rec.opportunity = el.value;
      else if(f==="packetQuestions") rec.packet.questions = el.value;
      else if(f==="packetReviewed") rec.packet.reviewed = el.checked;
      else if(f==="interviewDone"){ rec.interviewDone = el.checked; queueSave(); renderPerson(); return; }
      else if(f==="flywheelReviewed"){ rec.flywheel.reviewed = el.checked; queueSave(); renderPerson(); return; }
      else if(f==="flywheelBring") rec.flywheel.bring = el.value;
      queueSave();
    });
  });
  document.getElementById("btnMd").addEventListener("click", ()=>{
    if(!rec.interviewDone && !confirm("The Claude interview is required before you submit — it's the step that makes this an AAR instead of a form. Export anyway?")) return;
    const md = buildMarkdown(person, rec);
    const pv = document.getElementById("mdPreview");
    pv.value = md; pv.classList.add("show"); // always show what got copied
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(()=>toast("Copied — paste it to your regional or your 1:1 pulse"), ()=>toast("Copy blocked — select it from the preview below"));
    } else {
      toast("Copy not available in this browser — select it from the preview below");
    }
  });
  document.getElementById("btnMdPreview").addEventListener("click", ()=>{
    const pv = document.getElementById("mdPreview");
    pv.value = buildMarkdown(person, rec); pv.classList.toggle("show");
  });
  document.getElementById("btnJson").addEventListener("click", ()=>{
    if(!rec.interviewDone && !confirm("The Claude interview is required before you submit — it's the step that makes this an AAR instead of a form. Export anyway?")) return;
    downloadFile("aar-"+person.id+"-q2-2026.json", JSON.stringify(buildJsonRecord(person, rec), null, 2), "application/json");
    toast("JSON record downloaded");
  });
  const fwBtn = document.getElementById("btnFlywheelPrompt");
  if(fwBtn) fwBtn.addEventListener("click", ()=>{
    navigator.clipboard.writeText(buildFlywheelPrompt(person, rec)).then(()=>toast("Flywheel prompt copied \u2014 paste it to Claude"));
  });
  document.getElementById("btnInterview").addEventListener("click", ()=>{
    const prompt = buildInterviewPrompt(person, rec);
    const pv = document.getElementById("mdPreview");
    pv.value = prompt; pv.classList.add("show");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(prompt).then(()=>toast("Interview prompt copied — paste it into Claude and let it push back"), ()=>toast("Copy blocked — select it from the preview below"));
    } else {
      toast("Copy not available in this browser — select it from the preview below");
    }
  });
}

/* ============ Export builders ============ */
function computeScorecard(person, rec){
  // the QG success-rate baseline: per-goal grades, aggregable across managers/quarters
  const sc = { goalsTotal:(person.goals||[]).length, graded:0, sg:0, g:0, r:0, proj:0, successRatePct:null };
  (person.goals||[]).forEach(gl=>{
    const gr = rec.goals[gl.num]||{};
    if(gr.color){ sc.graded++; if(gr.proj) sc.proj++;
      if(gr.color==="SG") sc.sg++; else if(gr.color==="G") sc.g++; else if(gr.color==="R") sc.r++; }
  });
  if(sc.graded) sc.successRatePct = Math.round((sc.sg+sc.g)/sc.graded*100);
  return sc;
}
function buildMarkdown(person, rec){
  const d = new Date().toISOString().slice(0,10);
  let md = "# Q2 AAR — "+person.name+" — "+d+"\n";
  md += "*"+(POS_LABEL[person.position]||person.position)+" · "+person.branch+" · "+person.region+"*\n";
  const sc = computeScorecard(person, rec);
  md += "**Scorecard: "+sc.sg+" SG / "+sc.g+" G / "+sc.r+" R"+(sc.graded<sc.goalsTotal?" ("+(sc.goalsTotal-sc.graded)+" ungraded)":"")+(sc.successRatePct!==null?" — success rate "+sc.successRatePct+"%":"")+(sc.proj?" · "+sc.proj+" PROJ":"")+"**\n\n";
  const gutCheck = [];
  (person.goals||[]).forEach(g=>{
    const gr = rec.goals[g.num]||{};
    md += "## "+g.rock+" — CRIT: "+(g.critical?"yes":"no")+"\n";
    md += "- Color: "+(gr.color||"—")+(gr.proj?" (PROJ)":"")+"\n";
    md += "- Results: "+((gr.results||"").trim()||"—")+"\n";
    md += "- How we got here: "+((gr.how||"").trim()||"—")+"\n";
    md += "- Went well: "+((gr.well||"").trim()||"—")+"\n";
    md += "- Tried / differently / next-quarter lesson: "+((gr.diff||"").trim()||"—")+"\n\n";
    if(gr.color && !(gr.results||"").trim()) gutCheck.push("Goal \""+g.rock+"\" — colored "+gr.color+" with no results written");
  });
  md += "## CHOICES self-eval (1–5)\n";
  CORE_VALUES.forEach(cv=>{
    const v = rec.choices.items[cv], note = (rec.choices.itemNotes[cv]||"").trim();
    md += "- "+cv+": "+(v||"—")+(note?" — "+note:"")+"\n";
    if(v && !note) gutCheck.push("CHOICES \""+cv+"\" — rated "+v+" with no reasoning captured");
  });
  if(person.position === "BM"){
    const directs = directsFor(person);
    md += "\n## 2b · Evaluate your managers\n";
    if(!directs.length){
      md += "_No other seats on this branch to evaluate._\n";
    } else {
      directs.forEach(d=>{
        const de = (rec.directsEval||{})[d.name] || emptyDirectEval();
        md += "\n### "+d.name+" — "+(POS_LABEL[d.position]||d.position)+"\n**CHOICES**\n";
        CORE_VALUES.forEach(cv=>{
          const v = de.coreValues.items[cv], note = (de.coreValues.itemNotes[cv]||"").trim();
          md += "- "+cv+": "+(v||"—")+(note?" — "+note:"")+"\n";
          if(v && !note) gutCheck.push(d.name+" — CHOICES \""+cv+"\" — rated "+v+" with no reasoning captured");
        });
        md += "**Ideal Team Player**\n";
        ITP_TRAITS.forEach(t=>{
          const rt = de.itp[t.key]||{}, note = (rt.note||"").trim();
          md += "- "+t.label+": "+(rt.v||"—")+(note?" — "+note:"")+"\n";
          if(rt.v && !note) gutCheck.push(d.name+" — ITP \""+t.label+"\" — rated "+rt.v+" with no reasoning captured");
        });
        md += "**GWC**\n";
        [["get","Get it"],["want","Want it"],["capacity","Capacity to do it"]].forEach(([key,label])=>{
          const v = de.gwc[key], note = ((de.gwc.notes||{})[key]||"").trim();
          md += "- "+label+": "+(v===null||v===undefined?"—":(v?"Yes":"No"))+(note?" — "+note:"")+"\n";
          if(v!=null && !note) gutCheck.push(d.name+" — GWC "+label+" — answered with no reasoning captured");
        });
        const nm = de.nineMore || {performance:"same",culture:"same",note:""};
        md += "**Nine-More Test** (imagine nine more of them on the team)\n";
        md += "- Team performance: "+nm.performance+"\n- Team culture: "+nm.culture+"\n";
        md += "- Why: "+((nm.note||"").trim()||"—")+"\n";
        if(!((nm.note||"").trim())) gutCheck.push(d.name+" — Nine-More Test answered with no reasoning captured");
        if((de.overallNote||"").trim()) md += "- Note: "+de.overallNote.trim()+"\n";
      });
    }
  }
  const kpis = kpisFor(person.position);
  if(kpis.length){
    md += "\n## Position KPIs\n";
    kpis.forEach(k=>{
      const kr = rec.kpis[k.name]||{};
      md += "- "+k.name+": target "+(k.target||"(not consistently tracked)")+" · estimate "+((kr.est||"").trim()||"—")+" · actual "+((kr.actual||"").trim()||"—")+"\n";
    });
  }
  md += "\n## Constraint & opportunity (for the QGR room)\n";
  md += "- Biggest constraint: "+((rec.constraint||"").trim()||"—")+"\n";
  md += "- Biggest opportunity: "+((rec.opportunity||"").trim()||"—")+"\n";
  md += "\n## Claude interview (required)\n- Completed: "+(rec.interviewDone?"yes":"NOT DONE")+"\n";
  md += "\n## Flywheel pre-work (FLM QGR prep)\n- Reviewed + prompt run: "+(rec.flywheel.reviewed?"yes":"not yet")+"\n- Bringing to the room: "+((rec.flywheel.bring||"").trim()||"\u2014")+"\n";
  md += "\n## QGR packet\n- Reviewed: "+(rec.packet.reviewed?"yes":"not yet")+"\n- Questions for the room: "+((rec.packet.questions||"").trim()||"—")+"\n";
  if(gutCheck.length){
    md += "\n---\n### For the gut-check (incomplete grades)\n";
    gutCheck.forEach(x=>md += "- "+x+"\n");
  }
  return md;
}
function buildJsonRecord(person, rec){
  return {
    schema: "einstein-manager-aar/v1",
    exportedAt: new Date().toISOString(),
    quarter: QUARTER,
    interviewDone: !!rec.interviewDone,
    flywheel: { reviewed: !!rec.flywheel.reviewed, bring: (rec.flywheel.bring||"").trim() },
    person: { id: person.id, name: person.name, position: person.position, branch: person.branch, region: person.region, regional: person.regional||null },
    goals: (person.goals||[]).map(g=>{
      const gr = rec.goals[g.num]||{};
      return { num: g.num, rock: g.rock, critical: !!g.critical,
        definitions: { superGreen: g.superGreen||null, green: g.green||null, red: g.red||null },
        color: gr.color||null, proj: !!gr.proj,
        aar: { results: gr.results||"", how: gr.how||"", well: gr.well||"", differently: gr.diff||"" } };
    }),
    choices: CORE_VALUES.map(cv=>({ value: cv, score: rec.choices.items[cv]?Number(rec.choices.items[cv]):null, note: rec.choices.itemNotes[cv]||"" })),
    directsEval: person.position!=="BM" ? [] : directsFor(person).map(d=>{
      const de = (rec.directsEval||{})[d.name] || emptyDirectEval();
      return {
        direct: { id: d.id, name: d.name, position: d.position },
        coreValues: CORE_VALUES.map(cv=>({ value: cv, score: de.coreValues.items[cv]?Number(de.coreValues.items[cv]):null, note: de.coreValues.itemNotes[cv]||"" })),
        itp: ITP_TRAITS.map(t=>{
          const rt = de.itp[t.key]||{};
          return { trait: t.key, score: rt.v?Number(rt.v):null, note: rt.note||"" };
        }),
        gwc: { get: de.gwc.get, want: de.gwc.want, capacity: de.gwc.capacity, notes: Object.assign({get:"",want:"",capacity:""}, de.gwc.notes) },
        nineMore: { performance: (de.nineMore||{}).performance||"same", culture: (de.nineMore||{}).culture||"same", note: (de.nineMore||{}).note||"" },
        overallNote: de.overallNote||""
      };
    }),
    kpis: kpisFor(person.position).map(k=>{
      const kr = rec.kpis[k.name]||{};
      return { name: k.name, target: k.target||null, estimate: kr.est||null, actual: kr.actual||null };
    }),
    scorecard: computeScorecard(person, rec),
    constraint: rec.constraint||"", opportunity: rec.opportunity||"",
    packet: { reviewed: !!rec.packet.reviewed, questions: rec.packet.questions||"" },
    startedAt: rec.startedAt||null
  };
}
function parseClaudeResults(text, person){
  if(!text || !text.trim()) return null;
  // Path 1: a fenced json block (or any {...} with a goals array)
  const fences = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(m=>m[1]);
  const candidates = fences.length ? fences.concat([text]) : [text];
  for(let i=candidates.length-1; i>=0; i--){
    const c = candidates[i];
    const start = c.indexOf("{"), end = c.lastIndexOf("}");
    if(start===-1 || end<=start) continue;
    try{
      const j = JSON.parse(c.slice(start, end+1));
      if(j && Array.isArray(j.goals) && j.goals.length) return j;
    }catch(e){ /* keep looking */ }
  }
  // Path 2: fallback — parse the readable "## Goal — CRIT" blocks (different Claudes drift; this format survives)
  return person ? parseMarkdownResults(text, person) : null;
}
function matchGoalByName(name, person){
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const n = norm(name);
  if(!n) return null;
  let best = null;
  (person.goals||[]).forEach(g=>{
    const a = norm(g.rock);
    if(a===n || a.indexOf(n)===0 || n.indexOf(a)===0 || a.includes(n) || n.includes(a)){
      if(!best || Math.abs(a.length-n.length) < Math.abs(norm(best.rock).length-n.length)) best = g;
    }
  });
  if(!best){
    // last resort: leading "Goal 2:" / "2 ·" style numbers
    const m = name.match(/(?:goal\s*)?#?\s*(\d+)\s*[:·.—-]/i);
    if(m) best = (person.goals||[]).find(g=>String(g.num)===m[1]) || null;
  }
  return best;
}
function parseMarkdownResults(text, person){
  const FIELDS = [
    [/^[-*•]\s*\**color\**\s*:/i, "color"],
    [/^[-*•]\s*\**results\**\s*:/i, "results"],
    [/^[-*•]\s*\**how we got (?:here|there)\**\s*:/i, "how"],
    [/^[-*•]\s*\**(?:what )?went well\**\s*:/i, "well"],
    [/^[-*•]\s*\**(?:tried|differently|what (?:i(?:'d| would)? |you(?:'d| would)? )?(?:do |try )?differently)[^:]*:/i, "differently"]
  ];
  const goals = []; let cur = null, curField = null;
  const push = ()=>{ if(cur && (cur.color || cur.results || cur.how || cur.well || cur.differently)) goals.push(cur); };
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    const h = line.match(/^#{2,4}\s+(.+)$/);
    if(h){
      push();
      const name = h[1].replace(/\*/g,"").split(/—|--|\bCRIT\b/i)[0].trim();
      const pg = matchGoalByName(name, person);
      cur = pg ? {num: pg.num} : null; curField = null; continue;
    }
    if(!cur) continue;
    let matched = false;
    for(const [re, f] of FIELDS){
      if(re.test(line)){
        const val = line.replace(re,"").replace(/^\**/,"").trim();
        if(f==="color"){
          cur.proj = /proj/i.test(val);
          const v = " "+val.toLowerCase()+" ";
          cur.color = /super\s*green|[^a-z]sg[^a-z]/.test(v) ? "SG" : /red|[^a-z]r[^a-z]/.test(v) ? "R" : /green|[^a-z]g[^a-z]/.test(v) ? "G" : null;
          curField = null;
        } else { cur[f] = val; curField = f; }
        matched = true; break;
      }
    }
    if(!matched && curField && line && !/^```/.test(line) && !/^[-*•]\s/.test(line)){
      cur[curField] += "\n"+line;
    } else if(!matched && /^[-*•]\s/.test(line)){ curField = null; }
  }
  push();
  return goals.length ? {goals} : null;
}
function buildInterviewPrompt(person, rec){
  const goals = (person.goals||[]).map(g=>{
    const gr = rec.goals[g.num]||{};
    return "### Goal "+g.num+": "+g.rock+(g.critical?" (CRITICAL #)":"")+"\n"+
      "- Written definitions — Super Green: "+(g.superGreen||"—")+" | Green: "+(g.green||"—")+" | Red: "+(g.red||"—")+"\n"+
      "- My draft color: "+(gr.color||"not graded yet")+(gr.proj?" (PROJ)":"")+"\n"+
      "- My draft answers — Results: "+((gr.results||"").trim()||"(blank)")+" | How we got here: "+((gr.how||"").trim()||"(blank)")+" | Went well: "+((gr.well||"").trim()||"(blank)")+" | Tried/differently: "+((gr.diff||"").trim()||"(blank)");
  }).join("\n\n");
  return "You are my after-action-review coach. I'm "+person.name+", "+(POS_LABEL[person.position]||person.position)+" of the "+person.branch+" branch at Einstein Moving Company. Below are my Q2 2026 goals with the Super Green / Green / Red definitions written at quarter start, plus my draft self-assessment.\n\n"+
    "Interview me ONE GOAL AT A TIME through four questions:\n"+
    "1. Results — my numbers and color, graded against the WRITTEN definition, not the vibe. Challenge my color if it doesn't match.\n"+
    "2. How we got here — push past vague answers; ask for the brutal parts.\n"+
    "3. What went well — what should become a playbook.\n"+
    "4. What did I try, and what would I do differently — 'bullets before cannons': a bullet is a small cheap experiment beyond my seat's standard routine; a cannon is going big once a bullet proves out. If I describe routine work as a bullet, call it out. On my CRITICAL # goals, make me go deeper on questions 2 and 4.\n\n"+
    "Keep the interview TIGHT: one question at a time, at most two follow-ups per goal, and pull me back if either of us drifts onto a tangent — the whole thing should take 15-20 minutes, not an hour. If my answer is thin, push once, then take what I give you and move on.\n\n"+
    "If I genuinely didn't try anything beyond the routine, don't manufacture something — that's an honest answer, this is our first time running this exercise. Ask me ONCE what I WOULD try next quarter if I had to pick one cheap experiment, capture whatever I give you, and move on.\n\n"+
    "Be direct but fair — the goal is a truer self-assessment, not a softer one. When we finish all goals, output TWO things:\n\n"+
    "1. My final AAR, one readable block per goal:\n"+
    "## [Goal name] — CRIT: yes/no\n- Color: [SG/G/R] (PROJ if the quarter is still running)\n- Results: ...\n- How we got here: ...\n- Went well: ...\n- Tried / differently / next-quarter lesson: ...\n\n"+
    "2. Then a fenced ```json code block in EXACTLY this shape so my AAR tool can auto-fill my form (num must match the goal numbers above; nothing after the block):\n"+
    '{"goals":[{"num":1,"color":"SG|G|R","proj":true,"results":"...","how":"...","well":"...","differently":"..."}]}\n\n'+
    "I'll paste your whole final answer back into my AAR tool.\n\n---\n\n## MY GOALS AND DRAFTS\n\n"+goals;
}
function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type: mime||"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
